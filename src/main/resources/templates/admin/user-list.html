<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý nhân sự - HUTECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 px-4 shadow">
    <a class="navbar-brand fw-bold" th:href="@{/tasks/board}">
        <i class="bi bi-arrow-left-circle me-2"></i>Quay lại Bảng công việc
    </a>
</nav>

<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-primary">
                <i class="bi bi-people-fill me-2"></i>
                Nhân sự của: <span th:text="${companyName}">Tên Công Ty</span>
            </h5>
            <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#inviteModal">
                <i class="bi bi-person-plus-fill me-1"></i> + Mời Nhân Viên
            </button>
        </div>
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Họ Tên</th>
                    <th>Email (Tài khoản)</th>
                    <th>Chức vụ</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employees}">
                    <td class="fw-bold" th:text="${emp.fullName}">Họ tên</td>
                    <td th:text="${emp.username}">email@gmail.com</td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${emp.position != null ? emp.position : 'Chưa cập nhật'}">Chức vụ</span>
                    </td>
                    <td>
                        <a th:if="${emp.role != 'ADMIN'}"
                           th:href="@{/admin/users/delete/{id}(id=${emp.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('Xóa nhân viên này khỏi hệ thống?')">
                            <i class="bi bi-trash"></i> Xóa
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="inviteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form th:action="@{/admin/add-employee}" method="post" class="modal-content shadow-lg border-0">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fw-bold">Mời thành viên mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email nhân viên</label>
                    <input type="email" name="email" class="form-control" placeholder="nhanvien@gmail.com" required>
                    <div class="form-text">Nhân viên sẽ dùng email này để đăng nhập.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Họ và tên</label>
                    <input type="text" name="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="mb-3 text-center">
                    <div class="alert alert-warning p-2 small">
                        Mật khẩu mặc định là: <strong>123456</strong>
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="submit" class="btn btn-success px-4 fw-bold">Xác nhận mời</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
