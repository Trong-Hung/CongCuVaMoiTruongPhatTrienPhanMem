<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> <head>
    <meta charset="UTF-8">
    <title>HUTECH Course Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home">HUTECH Courses</a>

        <form class="d-flex mx-auto" th:action="@{/home}" method="get" style="width: 40%;">
            <input class="form-control me-2" type="search" name="keyword" th:value="${keyword}" placeholder="Tìm tên học phần..." aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

        <div class="d-flex align-items-center">
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-outline-light me-2 btn-sm">Đăng nhập</a>
                <a th:href="@{/register}" class="btn btn-warning btn-sm text-dark fw-bold">Đăng ký</a>
            </div>

            <div class="d-flex align-items-center">
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-outline-light me-2 btn-sm">Đăng nhập</a>
                    <a th:href="@{/register}" class="btn btn-warning btn-sm text-dark fw-bold">Đăng ký</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="text-white d-flex align-items-center">
                    <span class="me-3">Chào, <strong sec:authentication="name"></strong></span>

                    <a sec:authorize="hasAuthority('STUDENT')" th:href="@{/enroll/my-courses}" class="btn btn-info btn-sm me-2">Môn của tôi</a>

                    <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin/courses}" class="btn btn-danger btn-sm me-2">Quản lý</a>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Thoát</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary">Danh sách học phần</h2>
    </div>

    <div class="row">
        <div th:each="course : ${courses}" class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm border-0">
                <img th:src="@{/images/{img}(img=${course.image})}"
                     class="card-img-top"
                     style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${course.name}">Tên học phần</h5>
                    <p class="card-text mb-1 text-muted"><strong>Giảng viên:</strong> <span th:text="${course.lecturer}"></span></p>
                    <p class="card-text text-muted"><strong>Số tín chỉ:</strong> <span class="badge bg-secondary" th:text="${course.credits}"></span></p>

                    <a sec:authorize="hasAuthority('STUDENT')"
                       th:href="@{/enroll/{id}(id=${course.id})}"
                       class="btn btn-primary w-100 mt-2">Enroll Course</a>

                    <a sec:authorize="hasAuthority('ADMIN')"
                       th:href="@{/admin/courses/edit/{id}(id=${course.id})}"
                       class="btn btn-warning w-100 mt-2">Edit Course</a>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/home(pageNo=${currentPage - 1}, keyword=${keyword})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/home(pageNo=${i}, keyword=${keyword})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/home(pageNo=${currentPage + 1}, keyword=${keyword})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>

<footer class="text-center mt-5 py-4 text-muted border-top">
    &copy; 2026 - Võ Trọng Hùng - 2280601119 - Lớp 22DTHG3
</footer>

</body>
</html>
