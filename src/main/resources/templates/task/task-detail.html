<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết Công việc - HUTECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .comment-box { background: #f8f9fa; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .comment-avatar { width: 40px; height: 40px; object-fit: cover; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4 mb-4">
    <a class="navbar-brand fw-bold" th:href="@{/tasks/board}">HUTECH WORKFLOW</a>
    <div class="text-white">
        <a th:href="@{/tasks/board}" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Về Board</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h3 class="fw-bold text-dark" th:text="${task.title}"></h3>
                        <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-light btn-sm text-secondary"><i class="bi bi-pencil-square"></i> Sửa</a>
                    </div>

                    <h6 class="fw-bold text-muted text-uppercase mb-2 mt-4">Mô tả công việc</h6>
                    <div class="p-3 bg-light rounded" style="min-height: 100px; white-space: pre-wrap;"
                         th:text="${task.description != null and !task.description.isEmpty() ? task.description : 'Không có mô tả chi tiết.'}">
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h5 class="fw-bold border-bottom pb-2 mb-4"><i class="bi bi-chat-dots me-2"></i>Hoạt động & Bình luận</h5>

                    <form th:action="@{/tasks/comment}" method="post" class="mb-5">
                        <input type="hidden" name="taskId" th:value="${task.id}" />
                        <div class="d-flex gap-3">
                            <textarea name="content" class="form-control" rows="2" placeholder="Viết bình luận hoặc cập nhật tiến độ..." required></textarea>
                            <button type="submit" class="btn btn-primary px-4">Gửi</button>
                        </div>
                    </form>

                    <div th:each="cmt : ${comments}" class="comment-box d-flex gap-3">
                        <img th:src="${cmt.user.avatar != null ? cmt.user.avatar : 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="rounded-circle comment-avatar">
                        <div>
                            <div class="d-flex align-items-baseline gap-2 mb-1">
                                <span class="fw-bold text-dark" th:text="${cmt.user.fullName}"></span>
                                <small class="text-muted" th:text="${#temporals.format(cmt.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                            </div>
                            <p class="mb-0 text-dark" style="white-space: pre-wrap;" th:text="${cmt.content}"></p>
                        </div>
                    </div>
                    <div th:if="${comments == null or comments.isEmpty()}" class="text-center text-muted small py-3">
                        Chưa có bình luận nào.
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">

                    <h6 class="fw-bold text-muted text-uppercase mb-3">Trạng thái</h6>
                    <form th:action="@{/tasks/update-status}" method="post" class="mb-4">
                        <input type="hidden" name="taskId" th:value="${task.id}" />
                        <div class="input-group">
                            <select name="status" class="form-select fw-bold">
                                <option value="TODO" th:selected="${task.status == 'TODO'}">CẦN LÀM</option>
                                <option value="IN_PROGRESS" th:selected="${task.status == 'IN_PROGRESS'}">ĐANG LÀM</option>
                                <option value="PENDING_REVIEW" th:selected="${task.status == 'PENDING_REVIEW'}">CHỜ DUYỆT</option>
                                <option value="SUCCESS" th:selected="${task.status == 'SUCCESS'}">HOÀN THÀNH</option>
                                <option value="FAILED" th:selected="${task.status == 'FAILED'}">THẤT BẠI</option>
                            </select>
                            <button class="btn btn-outline-primary" type="submit">Cập nhật</button>
                        </div>
                    </form>

                    <h6 class="fw-bold text-muted text-uppercase mb-2">Người thực hiện</h6>
                    <div class="d-flex align-items-center mb-4">
                        <i class="bi bi-person-circle fs-4 me-2 text-primary"></i>
                        <span class="fw-bold" th:text="${task.assignee != null ? task.assignee.fullName : 'Chưa gán'}"></span>
                    </div>

                    <h6 class="fw-bold text-muted text-uppercase mb-2">Người theo dõi</h6>
                    <div class="d-flex align-items-center mb-4 flex-wrap gap-2">
                        <i class="bi bi-eye fs-4 text-secondary me-1"></i>
                        <span class="text-muted small" th:if="${task.followers == null or task.followers.isEmpty()}">Không có ai</span>
                        <span class="badge bg-secondary" th:each="f : ${task.followers}" th:text="${f.fullName}"></span>
                    </div>

                    <h6 class="fw-bold text-muted text-uppercase mb-2">Hạn chót</h6>
                    <div class="d-flex align-items-center">
                        <i class="bi bi-calendar-event fs-4 me-2 text-danger"></i>
                        <span class="fw-bold" th:text="${task.deadline != null ? #temporals.format(task.deadline, 'dd/MM/yyyy HH:mm') : 'Không thiết lập'}"></span>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
