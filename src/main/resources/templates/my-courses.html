<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Học phần đã đăng ký - HUTECH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home">HUTECH Courses</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3">Sinh viên: <strong sec:authentication="name"></strong></span>
            <a href="/home" class="btn btn-outline-light btn-sm">Quay lại trang chủ</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white p-3">
            <h4 class="mb-0 fw-bold">DANH SÁCH HỌC PHẦN ĐÃ ĐĂNG KÝ</h4>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Hình ảnh</th>
                        <th>Tên học phần</th>
                        <th>Giảng viên</th>
                        <th>Số tín chỉ</th>
                        <th>Ngày đăng ký</th>
                        <th class="text-center">Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="en : ${enrollments}">
                        <td class="ps-4">
                            <img th:src="@{/images/{img}(img=${en.course.image})}"
                                 style="width: 60px; height: 40px; object-fit: cover; border-radius: 4px;"
                                 onerror="this.src='https://via.placeholder.com/60?text=No+Img'">
                        </td>
                        <td class="fw-bold text-dark" th:text="${en.course.name}"></td>
                        <td th:text="${en.course.lecturer}"></td>
                        <td><span class="badge bg-secondary" th:text="${en.course.credits}"></span></td>
                        <td th:text="${#temporals.format(en.enrollDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="text-center">
                            <span class="badge bg-success">Thành công</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(enrollments)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            Bạn chưa đăng ký học phần nào. <a href="/home">Đăng ký ngay!</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 py-4 text-muted">
    &copy; 2026 - Võ Trọng Hùng - 2280601119 - Lớp 22DTHG3
</footer>

</body>
</html>
